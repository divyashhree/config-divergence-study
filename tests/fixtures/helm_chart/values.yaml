# Default values for sample-webapp
# This is the chart's values.yaml — the baseline configuration.

replicaCount: 1

image:
  repository: myorg/webapp
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  hosts: []
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilization: 80

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

env:
  - name: LOG_LEVEL
    value: "info"
  - name: DB_HOST
    value: "localhost"

persistence:
  enabled: false
  storageClass: ""
  size: 1Gi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

serviceAccount:
  create: true
  name: ""

nodeSelector: {}
tolerations: []
affinity: {}
